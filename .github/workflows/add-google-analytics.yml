name: Add Google Analytics

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-google-analytics.yml

permissions:
  contents: write

jobs:
  add-analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Add Google Analytics to every page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          measurement_id = "G-16TM5L670W"
          snippet = '''  <!-- Google tag (gtag.js) -->
            <script async src="https://www.googletagmanager.com/gtag/js?id=G-16TM5L670W"></script>
            <script>
              window.dataLayer = window.dataLayer || [];
              function gtag(){dataLayer.push(arguments);}
              gtag('js', new Date());
              gtag('config', 'G-16TM5L670W');
            </script>
          '''

          updated = []
          for path in sorted(Path('.').glob('*.html')):
              text = path.read_text(encoding='utf-8')
              if measurement_id in text or '<head>' not in text:
                  continue
              text = text.replace('<head>', '<head>\n' + snippet, 1)
              path.write_text(text, encoding='utf-8')
              updated.append(str(path))

          print('Updated:', ', '.join(updated) if updated else 'none')
          PY

      - name: Publish tracking update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Add Google Analytics tracking"
          git push
