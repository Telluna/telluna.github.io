name: Add Google Analytics

on:
  push:
    branches:
      - patch-1
    paths:
      - .github/workflows/add-google-analytics.yml

permissions:
  contents: write

jobs:
  add-analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Google Analytics to every page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          measurement_id = "G-16TM5L670W"
          snippet = '''  <!-- Google tag (gtag.js) -->
            <script async src="https://www.googletagmanager.com/gtag/js?id=G-16TM5L670W"></script>
            <script>
              window.dataLayer = window.dataLayer || [];
              function gtag(){dataLayer.push(arguments);}
              gtag('js', new Date());
              gtag('config', 'G-16TM5L670W');
            </script>
          '''
          for path in sorted(Path('.').glob('*.html')):
              text = path.read_text(encoding='utf-8')
              if measurement_id not in text and '<head>' in text:
                  path.write_text(text.replace('<head>', '<head>\n' + snippet, 1), encoding='utf-8')
          PY
      - name: Publish tracking update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Google Analytics tracking"
          git push
